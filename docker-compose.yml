version: "3"
services:
  importer-postgres:
    image: postgres:15-alpine
    container_name: importer-postgres
    restart: always
    environment:
      POSTGRES_DB: "import"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    ports:
      - "5432:5432"
    volumes:
      - importer-postgres:/var/lib/postgresql/data
volumes:
  importer-postgres:
